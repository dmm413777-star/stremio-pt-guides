baseURL = "https://denunciastremio.pages.dev/"
locale = "pt-PT"
title = "Denuncia Stremio"
theme = "hextra"

enableRobotsTXT = true
enableGitInfo = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "Guias de Stremio e Nuvio em português — simples, directos e actualizados pela comunidade."

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.theme]
    default = "dark"
    displayToggle = true

  [params.footer]
    enable = false

  [params.search]
    enable = true

  customCSS = ["css/custom.css"]

[menu]
  [[menu.main]]
    identifier = "guias"
    name = "Guias"
    pageRef = "/guias"
    weight = 1

  [[menu.main]]
    identifier = "links"
    name = "Links"
    pageRef = "/links"
    weight = 2

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false

[taxonomies]
  tag = "tags"
  category = "categorias"

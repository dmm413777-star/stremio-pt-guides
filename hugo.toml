baseURL = "https://dmm413777-star.github.io/stremio-pt-guides/"
languageCode = "pt-PT"
title = "Stremio PT Guides"
theme = "PaperMod"

[params]
  description = "Guias de Stremio e Nuvio em português — simples, diretos e atualizados."
  author = "Stremio PT"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  disableScrollToTop = false

  [params.homeInfoParams]
    Title = "Stremio PT Guides"
    Content = "Guias de Stremio e Nuvio escritos em português — simples, diretos e atualizados pela comunidade."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/dmm413777-star/stremio-pt-guides"

  [[params.socialIcons]]
    name = "reddit"
    url = "https://www.reddit.com/r/PiratariaTuga/"

[menu]
  [[menu.main]]
    identifier = "guias"
    name = "Guias"
    url = "/guias/"
    weight = 10

  [[menu.main]]
    identifier = "ferramentas"
    name = "Ferramentas"
    url = "/ferramentas/"
    weight = 20

  [[menu.main]]
    identifier = "links"
    name = "Links Úteis"
    url = "/links/"
    weight = 30

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

[taxonomies]
  tag = "tags"
  category = "categorias"
